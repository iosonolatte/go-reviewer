[package]
name = "go-reviewer"
version = "0.1.0"
description = "Go-Reviewer: AI Go review desktop app powered by KataGo"
authors = ["go-reviewer"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "go_reviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
portpicker = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
once_cell = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
